#
# Coolify state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# List here what you want to save during backup : volumes or file Path
#

# Secrets and settings of the containers (mode 0600)
state/coolify.env
state/coolify-db.env
state/database.env
state/redis.env

# PostgreSQL dump written by bin/module-dump-state. Backups of module
# releases up to 1.8.0 lack it: restore-module then starts an empty database.
state/coolify.pg_dump

volumes/coolify-ssh
volumes/coolify-applications
volumes/coolify-databases
volumes/coolify-services
volumes/coolify-backups
volumes/coolify-webhooks
volumes/coolify-images
